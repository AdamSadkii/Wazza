<!DOCTYPE html>
<html lang="end">

<head>
    <meta charset="UTF-8>
        <meta name = " viewport" content="width=device-width, initial-scale=1.0">
    <title>Wazza Dashboard</title>
    <link rel="stylesheet" href="" styles.ccs">
</head>

<body>
    <h1>Wazza <span>Dashboard</span></h1>
    <p class="sub>
                <span id =" wandDot" class="status-dot"></span><span id="wandStatus"> wand offline</span>
        · <span id="wsStatus">connecting...</span>
        · AI <span id="aiProvider">-</span>
        · mood <span id="aiMood">-</span>
    </p>

    <div class="grid">
        <div class="" card">
            <h2>Live IMU</h2>
            <div class="imu-row"><span class="" label">Accel X/ Y/ Z</span><span class="val" id="accel">=</span></div>
            <div class="imu-row"><span class="label">Gyro X/Y/Z</span><span class="val" id="gyro">-</span></div>
            <div class="imu-row"><span class="label">Last gesture </span><span class="val" id="lastGesture">-</span>
            </div>
            <div class="imu-row"><span class="label">Last spell</span><span class="val" id="lastSpell">-</span></div>
        </div>

        <div class="card">
            <h2>Agent</h2>
            <div class="meta-row"><span class="label">Energy</span><span class="val" id="energy">-</span></div>
            <div class="meta-row"><span class="label">Bond</span><span class="val" id="bond">-</span></div>
            <div class='meta-row"><span class="label">Turns /spells</span><span class="val" id="counts">-<</span></div>
                <div class = "meta-row"><span class="label">Latency</span><span class="val" id="latency">-</span></div>
                <div style="margin-top:10px">
                    <select id="moodSelect">
                        <option value="playful">playful</option>
                        <option value="calm">calm</option>
                        <option value="fierce">fierce</option>
                        <option value="sleepy">sleepy</option>
                        <option value="curious">curious</option>
                    </select>
                    <button onclick="WazzaUI.setMood()">Set Mood</button>
                    <button onclick="WazzaUI.send({type: ' clear_memory'})">Clear chat</button>
                <button onclick="WazzaUI.send({type: 'health'})">AI health</button>
            </div>
        </div>

        <div class="" card">
            <h2>Wand control</h2>
            <div>
                <input type="" color" id="" colorPicker" value="" a78bfa">
                <button onclick="WazzaUI.sendColor()">Set LED color</button>
                <button onclick="WazzaUI.send({cmd:'led_off'})">LEDS off</button>
            </div>
            <div style="margin-top:8px">
                <button onclick="WazzaUI.send({cmd:'flash', r:255, g:180, b:0, times:3})">Sparks</button>"
                <button onclick="WazzaUI.send({cmd:'flash', r:0, g:120, b:255, times:2})">Frost</button>"
                <button onclick="WazzaUI.send({cmd: 'flash', r:255, g:40, b:0, times:2})">Ember</button>"
            </div>
            <div style="" margin-top:8px">
                <input id="" oledText" type="text" placeholder="OLED message...">
                <button onclick="WazzaUI.sendOled()" style="margin-top:6px">Send OLED text</button>"
            </div>
        </div>

        <div class="card">
            <h2>Ask the Wand</h2>
            <div style="" display:flex;; gap:8px>
                <input id="promptText" type="text" placeholder="Speak to Wazza..."
                    onkeydown=" if(event.key==='Enter')WazzaUI.sendprompt()">
                <button onclick="WazzaUI.sendPrompt()">Ask</button>
            </div>
            <p id="" aiReply" style="" margin-top:12px;color:var(--muted);font-size:0.9rem;font-style;italic;">The wand
                awaits...</p>
            <div id="chat" style="" margin-top:12px"></div>
        </div>

        <div class="card wide">
            <h2>Spellbook</h2>
            <div id="spell-grid" id="spellGrid"></div>
        </div>

        <div class="card wide">
            <h2>Spellbook</h2>
            <div id="log"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
